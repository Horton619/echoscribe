<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131C2E"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24D"/>
      <stop offset="1" stop-color="#FF9E3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle base (Apple 824 content grid) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFB547" stroke-opacity="0.22" stroke-width="3"/>

  <!-- sound-wave arcs radiating from the mic -->
  <g fill="none" stroke="url(#amber)" stroke-linecap="round">
    <path d="M372 512 a150 150 0 0 1 0 -150" stroke-width="20" opacity="0.85"/>
    <path d="M332 552 a220 220 0 0 1 0 -230" stroke-width="20" opacity="0.55"/>
    <path d="M652 512 a150 150 0 0 0 0 -150" stroke-width="20" opacity="0.85"/>
    <path d="M692 552 a220 220 0 0 0 0 -230" stroke-width="20" opacity="0.55"/>
  </g>

  <!-- microphone -->
  <g>
    <rect x="462" y="322" width="100" height="220" rx="50" fill="#0E1726" stroke="url(#amber)" stroke-width="20"/>
    <line x1="486" y1="372" x2="538" y2="372" stroke="#FFB547" stroke-width="8" opacity="0.6" stroke-linecap="round"/>
    <line x1="486" y1="410" x2="538" y2="410" stroke="#FFB547" stroke-width="8" opacity="0.6" stroke-linecap="round"/>
    <line x1="486" y1="448" x2="538" y2="448" stroke="#FFB547" stroke-width="8" opacity="0.6" stroke-linecap="round"/>
    <path d="M430 520 a82 82 0 0 0 164 0" fill="none" stroke="url(#amber)" stroke-width="20" stroke-linecap="round"/>
    <line x1="512" y1="602" x2="512" y2="668" stroke="url(#amber)" stroke-width="20" stroke-linecap="round"/>
    <line x1="452" y1="668" x2="572" y2="668" stroke="url(#amber)" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
