name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # macOS arm64 — Apple Silicon only (mlx cannot install/run on Intel).
  # Builds the PyInstaller onedir backend, vendors static ffmpeg, then
  # electron-builder signs + notarizes a DMG (+ ZIP for auto-update).
  # ---------------------------------------------------------------------------
  release-mac:
    runs-on: macos-14        # Apple Silicon runner — required for mlx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mlx-whisper

      - name: Build PyInstaller backend (onedir, bundles mlx Metal libs)
        run: |
          cd backend
          pyinstaller --clean --noconfirm transcribe.spec

      - name: Vendor static ffmpeg + ffprobe (arm64)
        run: |
          mkdir -p vendor/ffmpeg/mac
          base="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0"
          for b in ffmpeg ffprobe; do
            curl -sL "$base/${b}-darwin-arm64.gz" -o "vendor/ffmpeg/mac/${b}.gz"
            gunzip "vendor/ffmpeg/mac/${b}.gz"
            chmod +x "vendor/ffmpeg/mac/${b}"
          done
          ./vendor/ffmpeg/mac/ffmpeg -version | head -1

      - name: Install Node dependencies
        run: npm ci

      # Build + sign + notarize LOCALLY (no publish yet). electron-builder emits
      # the signed+notarized .app, the ZIP, and latest-mac.yml (the auto-update
      # chain) into dist/. Notarization runs at afterSign, so it still happens.
      # Publishing is deferred so a DMG failure can't leave a zip-only release.
      - name: Build app + zip, sign, notarize (no publish)
        env:
          CSC_LINK:                    ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:            ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never

      # Build the branded installer DMG natively on the arm64 runner via appdmg.
      # electron-builder forces APFS on Apple Silicon, and Finder won't render a
      # custom DMG background on APFS — appdmg makes an HFS+ image (verified fine
      # on arm64), which renders the background. No Intel runner involved.
      - name: Build branded HFS+ DMG (appdmg)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes appdmg build/appdmg.json "dist/EchoScribe-${VERSION}-arm64.dmg"

      # Fail the job BEFORE publishing if any required artifact is missing, so we
      # never ship an incomplete release.
      - name: Verify all release artifacts exist
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ls -la dist
          for f in \
            "dist/EchoScribe-${VERSION}-arm64.dmg" \
            "dist/EchoScribe-${VERSION}-arm64-mac.zip" \
            "dist/latest-mac.yml" ; do
            test -f "$f" || { echo "MISSING artifact: $f"; exit 1; }
          done

      # Publish everything to the release in one shot, now that all artifacts
      # exist. Create the release for the pushed tag; fall back to upload if a
      # re-run finds it already there.
      - name: Publish GitHub release with all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=$(node -p "require('./package.json').version")
          ASSETS=(
            "dist/EchoScribe-${VERSION}-arm64.dmg"
            "dist/EchoScribe-${VERSION}-arm64-mac.zip"
            "dist/EchoScribe-${VERSION}-arm64-mac.zip.blockmap"
            "dist/latest-mac.yml"
          )
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --title "$TAG" --notes "EchoScribe $TAG" --latest
          fi
