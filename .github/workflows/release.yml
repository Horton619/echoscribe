name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # macOS arm64 — Apple Silicon only (mlx cannot install/run on Intel).
  # Builds the PyInstaller onedir backend, vendors static ffmpeg, then
  # electron-builder signs + notarizes a DMG (+ ZIP for auto-update).
  # ---------------------------------------------------------------------------
  release-mac:
    runs-on: macos-14        # Apple Silicon runner — required for mlx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mlx-whisper

      - name: Build PyInstaller backend (onedir, bundles mlx Metal libs)
        run: |
          cd backend
          pyinstaller --clean --noconfirm transcribe.spec

      - name: Vendor static ffmpeg + ffprobe (arm64)
        run: |
          mkdir -p vendor/ffmpeg/mac
          base="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0"
          for b in ffmpeg ffprobe; do
            curl -sL "$base/${b}-darwin-arm64.gz" -o "vendor/ffmpeg/mac/${b}.gz"
            gunzip "vendor/ffmpeg/mac/${b}.gz"
            chmod +x "vendor/ffmpeg/mac/${b}"
          done
          ./vendor/ffmpeg/mac/ffmpeg -version | head -1

      - name: Install Node dependencies
        run: npm ci

      # electron-builder produces the signed+notarized .app, the ZIP, and
      # latest-mac.yml (the auto-update chain). No dmg target — we build a
      # nicer one below. The .app is stapled here, so the DMG opens cleanly.
      - name: Build app + zip, sign, notarize, publish
        env:
          GH_TOKEN:                    ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK:                    ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:            ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish always

      # Build the branded installer DMG natively on the arm64 runner via appdmg.
      # electron-builder forces APFS on Apple Silicon, and Finder won't render a
      # custom DMG background on APFS — appdmg makes an HFS+ image (verified fine
      # on arm64), which renders the background. No Intel runner involved.
      - name: Build branded HFS+ DMG (appdmg)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DMG="dist/EchoScribe-${VERSION}-arm64.dmg"
          npx --yes appdmg build/appdmg.json "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Upload branded DMG to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release upload "$TAG" "$DMG_PATH" --repo ${{ github.repository }} --clobber
